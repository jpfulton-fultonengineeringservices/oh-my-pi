telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
# @tavily/core 1.1.0 is inside the cooldown and is the first release that exports
# createTransport — the seam packages/tavily builds its own verbs on — so the pin
# cannot drop to 1.0.0 to satisfy the age check. Exempted deliberately.
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "kitty-vt-wasm", "@stencil-hq/vibemon", "@tavily/core"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
#
# `bazel-*` are Bazel's convenience symlinks, and `bazel-oh-my-pi` points at
# the workspace root itself: without this the scanner recurses through that
# loop, exhausts file descriptors, and every test that pipes a child process's
# stdio fails with empty output or EPIPE.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "sdk/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
  "bazel-*/**",
  "**/bazel-out/**",
]

[run]
bun = true
